<h1>Temporadas</h1>

<app-tabla-generica endpoint="/temporadas" [columnas]="columnas" (crear)="abrirCrear()" (editar)="abrirEditar($event)" />

<p-dialog header="Temporada" [(visible)]="dialogoVisible" [modal]="true" [style]="{ width: '400px' }">
  <form [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
    <label for="nombre">Nombre</label>
    <input id="nombre" pInputText formControlName="nombre" placeholder="Primavera-verano" />

    <label for="anio">Año</label>
    <p-inputnumber inputId="anio" formControlName="anio" [useGrouping]="false" />

    <label for="fecha_inicio">Desde (opcional)</label>
    <p-datepicker inputId="fecha_inicio" formControlName="fecha_inicio" dateFormat="dd/mm/yy" [showIcon]="true" />

    <label for="fecha_fin">Hasta (opcional)</label>
    <p-datepicker inputId="fecha_fin" formControlName="fecha_fin" dateFormat="dd/mm/yy" [showIcon]="true" />

    <p-button type="submit" label="Guardar" styleClass="w-full" />
  </form>
</p-dialog>
