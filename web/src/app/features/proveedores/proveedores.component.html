<h1>Proveedores</h1>

<app-tabla-generica endpoint="/proveedores" [columnas]="columnas" (crear)="abrirCrear()" (editar)="abrirEditar($event)" />

<p-dialog header="Proveedor" [(visible)]="dialogoVisible" [modal]="true" [style]="{ width: '420px' }">
  <form [formGroup]="formulario" (ngSubmit)="guardar()" class="formulario">
    <label for="nombre">Nombre</label>
    <input id="nombre" pInputText formControlName="nombre" />

    <label for="nit">NIT</label>
    <input id="nit" pInputText formControlName="nit" />

    <label for="contacto">Contacto</label>
    <input id="contacto" pInputText formControlName="contacto" />

    <label for="telefono">Teléfono</label>
    <input id="telefono" pInputText formControlName="telefono" />

    <label for="email">Email</label>
    <input id="email" type="email" pInputText formControlName="email" />

    <label for="direccion">Dirección</label>
    <input id="direccion" pInputText formControlName="direccion" />

    <p-button type="submit" label="Guardar" styleClass="w-full" />
  </form>
</p-dialog>
